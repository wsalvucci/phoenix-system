name: Tests

# Unit tests, SQL and role-level database tests, and browser tests against a throwaway LOCAL Supabase stack
# started inside the runner. Nothing here touches a real project: no secrets, no `link`, no `db push`.
# See docs/TESTING.md.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:unit

  database-and-e2e:
    name: Database tests and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Local stack only: migrations are replayed from supabase/migrations/ and supabase/seed.sql is loaded.
      - name: Start local Supabase
        run: supabase start

      - name: Write .env.test.local from the local stack
        run: npm run test:env

      - name: Database tests (pgTAP and role-level API checks)
        run: npm run test:db

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Build the app against the local stack
        run: |
          set -a
          . ./.env.test.local
          set +a
          npm run build

      - name: End-to-end tests
        env:
          E2E_SERVER: start
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
